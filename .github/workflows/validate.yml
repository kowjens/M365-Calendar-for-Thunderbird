name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Syntax and regression tests
        run: python tools/run_tests.py
      - name: Public neutrality and ATN checks
        run: |
          python tools/neutrality_check.py
          python tools/atn_check.py
      - name: Build public and ATN XPIs
        run: |
          python tools/build_xpi.py --all
          python tools/build_xpi.py --atn
