name: Validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Syntax and regression tests
        run: python tools/run_tests.py
      - name: Neutrality check
        run: python tools/neutrality_check.py
      - name: Build public XPIs
        run: python tools/build_xpi.py --all
