name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Full public release audit
        run: python tools/release_audit.py
      - name: Official Thunderbird webext-linter - ATN STANDARD
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          DISPLAY="$(python - <<'PY'
          import pathlib
          v=pathlib.Path('VERSION').read_text().strip().split('.')
          print(f'{v[0]}.{v[2]}' if len(v)==3 and v[1]=='0' else '.'.join(v))
          PY
          )"
          XPI="$GITHUB_WORKSPACE/release/M365_Thunderbird_Calendar_V${DISPLAY}_ATN_STANDARD.xpi"
          git clone --depth 1 https://github.com/thunderbird/webext-linter.git "$RUNNER_TEMP/webext-linter"
          cd "$RUNNER_TEMP/webext-linter"
          npm ci
          node verify.js "$XPI"
